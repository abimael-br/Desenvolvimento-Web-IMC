<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protótipo IMC - Entrada</title>
    <link rel="stylesheet" href="style.css">
</head>

<!-- Index feito por Abimael -->

<body>

    <div class="box">
        <h2>Protótipo IMC</h2>
        <form id="formImc">
            <div class="campo">
                <label>Nome</label>
                <input type="text" id="nome" required>
            </div>
            <div class="campo">
                <label>Idade</label>
                <input type="number" id="idade" min="1" max="120" required>
            </div>
            <div class="campo">
                <label>Sexo</label>
                <div class="radio-grupo">
                    <label><input type="radio" name="sexo" value="M" checked> M</label>
                    <label><input type="radio" name="sexo" value="F"> F</label>
                </div>
            </div>
            <div class="campo">
                <label>Peso (kg)</label>
                <input type="number" id="peso" step="0.1" required>
            </div>
            <div class="campo">
                <label>Altura (m)</label>
                <input type="number" id="altura" step="0.01" required>
            </div>
            <button type="submit">Calcular</button>
        </form>
    </div>

    <script>
        document.getElementById('formImc').addEventListener('submit', function(e) {
    e.preventDefault();

    let alturaInformada = parseFloat(document.getElementById('altura').value);
    
    if (alturaInformada > 3) {
        alturaInformada = alturaInformada / 100;
    }

    const dados = {
        nome: document.getElementById('nome').value,
        idade: parseInt(document.getElementById('idade').value),
        sexo: document.querySelector('input[name="sexo"]:checked').value,
        peso: parseFloat(document.getElementById('peso').value),
        altura: alturaInformada
    };

    localStorage.setItem('dadosIMC', JSON.stringify(dados));
    window.location.href = 'resultado.html';
});
    </script>
</body>

</html>
