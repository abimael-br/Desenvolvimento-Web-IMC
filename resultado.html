<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protótipo IMC - Resultado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            padding: 40px 20px;
            color: #333;
        }
        
        .box {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        .res-destaque {
            text-align: center;
            background: #eee;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .num-imc {
            font-size: 36px;
            font-weight: bold;
            margin: 5px 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        
        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        
        th {
            background-color: #f2f2f2;
        }
        
        .linha-ativa {
            background-color: #d1ecf1 !important;
            font-weight: bold;
        }
        
        .btn-voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Resultado</h2>

        <div class="res-destaque">
            <p id="infoUser"></p>
            <div class="num-imc" id="valorImc">0.0</div>
            <p id="statusImc"></p>
        </div>

        <h3>Médias de Referência</h3>
        <table>
            <thead>
                <tr>
                    <th>Idade</th>
                    <th>Sexo</th>
                    <th>Peso Mestre</th>
                    <th>Alt. Média</th>
                    <th>IMC Ref.</th>
                </tr>
            </thead>
            <tbody>
                <tr id="r-j-m">
                    <td>18-24</td>
                    <td>M</td>
                    <td>72kg</td>
                    <td>1.75m</td>
                    <td>23.5</td>
                </tr>
                <tr id="r-j-f">
                    <td>18-24</td>
                    <td>F</td>
                    <td>61kg</td>
                    <td>1.63m</td>
                    <td>23.0</td>
                </tr>
                <tr id="r-a-m">
                    <td>25-44</td>
                    <td>M</td>
                    <td>78kg</td>
                    <td>1.76m</td>
                    <td>25.2</td>
                </tr>
                <tr id="r-a-f">
                    <td>25-44</td>
                    <td>F</td>
                    <td>66kg</td>
                    <td>1.64m</td>
                    <td>24.5</td>
                </tr>
                <tr id="r-m-m">
                    <td>45-64</td>
                    <td>M</td>
                    <td>81kg</td>
                    <td>1.74m</td>
                    <td>26.7</td>
                </tr>
                <tr id="r-m-f">
                    <td>45-64</td>
                    <td>F</td>
                    <td>70kg</td>
                    <td>1.61m</td>
                    <td>27.0</td>
                </tr>
                <tr id="r-i-m">
                    <td>65+</td>
                    <td>M</td>
                    <td>75kg</td>
                    <td>1.70m</td>
                    <td>26.0</td>
                </tr>
                <tr id="r-i-f">
                    <td>65+</td>
                    <td>F</td>
                    <td>65kg</td>
                    <td>1.57m</td>
                    <td>26.4</td>
                </tr>
            </tbody>
        </table>

        <a href="index.html" class="btn-voltar">← Voltar e Recalcular</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dadosRaw = localStorage.getItem('dadosIMC');

            if (!dadosRaw) {
                window.location.href = 'index.html';
                return;
            }

            const dados = JSON.parse(dadosRaw);
            const imc = dados.peso / (dados.altura * dados.altura);

            let status = "";
            if (imc < 18.5) status = "Abaixo do peso";
            else if (imc < 24.9) status = "Peso normal";
            else if (imc < 29.9) status = "Sobrepeso";
            else status = "Obesidade";

            document.getElementById('infoUser').innerText = `${dados.nome}, ${dados.idade} anos, Sexo: ${dados.sexo}`;
            document.getElementById('valorImc').innerText = imc.toFixed(1);
            document.getElementById('statusImc').innerText = status;

            let idLinha = "";
            if (dados.idade <= 24) {
                idLinha = dados.sexo === 'M' ? 'r-j-m' : 'r-j-f';
            } else if (dados.idade <= 44) {
                idLinha = dados.sexo === 'M' ? 'r-a-m' : 'r-a-f';
            } else if (dados.idade <= 64) {
                idLinha = dados.sexo === 'M' ? 'r-m-m' : 'r-m-f';
            } else {
                idLinha = dados.sexo === 'M' ? 'r-i-m' : 'r-i-f';
            }

            const alvo = document.getElementById(idLinha);
            if (alvo) {
                alvo.classList.add('linha-ativa');
            }
        });
    </script>
</body>

</html>
